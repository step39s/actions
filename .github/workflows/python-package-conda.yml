name: Run Python Tests

# 触发事件
on:
  push:
  pull_request: # Pull Request 提交流程时触发

# 定义任务
jobs:
  test-python:
    runs-on: ubuntu-latest  # 使用 Ubuntu 最新版本作为运行环境

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # 选择 Python 版本

#      # 安装依赖
#      - name: Install Python dependencies
#        run: |
#          python -m pip install --upgrade pip
#          pip install -r requirements.txt  # 安装项目依赖（assumes `requirements.txt` is present）

      # 运行 Python 脚本或测试
      - name: Run Python script
        run: |
          python main.py  # 替换为你的 Python 脚本文件
